{% extends "base.html" %}

{% block title %}Inicio - {{ proyecto }}{% endblock %}

{% block body_class %}body-inicio{% endblock %}

{% block content %}

<div class="hero-section">
        <h1 class="titulo-inicio">¡{{ proyecto }}!</h1>
        <p class="subtitle">Prepárate para la aventura definitiva.</p>
        
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" alt="Logo de Pokémon" class="pokemon-image">
        <a href="{{ url_for('listado') }}" class="btn-empezar">Ver Pokémons</a>
    </div>

    <footer>
        {{ proyecto }} - {{ nombre }} - {{ año }}
    </footer>

{% endblock %}
